<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">When the prompt leaves out a fact, asking beats planning</title>
  <desc id="d">First builds that passed the hidden tests, out of 12, with 95 percent intervals: plain chat that cannot ask 2 (2.1 to 48.4 percent); plain chat that may ask 12 (73.5 to 100 percent); plan with a questions step 11 (61.5 to 99.8 percent); plan plus /challenge review 10 (51.6 to 97.9 percent). Total tokens for the 12 runs: 99,093; 42,328; 74,323; 337,609.</desc>
  <rect x="0.5" y="0.5" width="879" height="299" rx="8" fill="#fcfcfb" stroke="#e3e2de"/>

  <text x="20" y="32" font-size="16" font-weight="600" fill="#0b0b0b">When the prompt leaves out a fact, asking beats planning</text>
  <text x="20" y="52" font-size="12" fill="#52514e">6 small coding tasks, run twice each (12 runs per approach), with key facts left out of each prompt. Hidden tests judge the first build.</text>

  <text x="212" y="86" font-size="12" font-weight="600" fill="#0b0b0b">First builds passed, of 12 (bar) and 95% interval (line)</text>
  <text x="600" y="86" font-size="12" font-weight="600" fill="#0b0b0b">Total tokens, 12 runs</text>

  <g font-size="12" fill="#0b0b0b">
    <text x="20" y="114">Plain chat, can’t ask</text>
    <text x="20" y="150" font-weight="600">Plain chat, may ask</text>
    <text x="20" y="186">Plan with a questions step</text>
    <text x="20" y="222">Plan + /challenge review</text>
  </g>

  <!-- left: x0 = 212, 220 px = 12 passes -->
  <g>
    <rect x="212" y="100" width="36.7" height="20" rx="3" fill="#c8c7c2"/>
    <rect x="212" y="136" width="220" height="20" rx="3" fill="#1baf7a"/>
    <rect x="212" y="172" width="201.7" height="20" rx="3" fill="#8d8c87"/>
    <rect x="212" y="208" width="183.3" height="20" rx="3" fill="#8d8c87"/>
  </g>
  <g stroke="#0b0b0b" stroke-width="1.5">
    <line x1="216.6" y1="110" x2="318.5" y2="110"/><line x1="216.6" y1="105" x2="216.6" y2="115"/><line x1="318.5" y1="105" x2="318.5" y2="115"/>
    <line x1="373.7" y1="146" x2="432" y2="146"/><line x1="373.7" y1="141" x2="373.7" y2="151"/><line x1="432" y1="141" x2="432" y2="151"/>
    <line x1="347.3" y1="182" x2="431.6" y2="182"/><line x1="347.3" y1="177" x2="347.3" y2="187"/><line x1="431.6" y1="177" x2="431.6" y2="187"/>
    <line x1="325.5" y1="218" x2="427.4" y2="218"/><line x1="325.5" y1="213" x2="325.5" y2="223"/><line x1="427.4" y1="213" x2="427.4" y2="223"/>
  </g>
  <g font-size="12" font-weight="600" fill="#0b0b0b">
    <text x="444" y="114">2</text>
    <text x="444" y="150">12</text>
    <text x="444" y="186">11</text>
    <text x="444" y="222">10</text>
  </g>

  <!-- right: x0 = 600, 200 px = 337,609 tokens -->
  <g>
    <rect x="600" y="100" width="58.7" height="20" rx="3" fill="#c8c7c2"/>
    <rect x="600" y="136" width="25.1" height="20" rx="3" fill="#1baf7a"/>
    <rect x="600" y="172" width="44.0" height="20" rx="3" fill="#8d8c87"/>
    <rect x="600" y="208" width="200" height="20" rx="3" fill="#8d8c87"/>
  </g>
  <g font-size="12" fill="#52514e">
    <text x="665" y="114">99,093</text>
    <text x="631" y="150" font-weight="600" fill="#0b0b0b">42,328 (fewest)</text>
    <text x="650" y="186">74,323</text>
    <text x="806" y="222">337,609</text>
  </g>
  <line x1="212" y1="96" x2="212" y2="232" stroke="#b9b8b3"/>
  <line x1="600" y1="96" x2="600" y2="232" stroke="#b9b8b3"/>

  <text x="20" y="262" font-size="11" fill="#6b6a66">12 of 12 is not “always”: its 95% interval runs down to 73.5% (Clopper-Pearson, evals/intervals.py).</text>
  <text x="20" y="280" font-size="11" fill="#6b6a66">The simulated user answered every question fully, which favours asking. Real users may not.</text>
</svg>
