<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 226" width="880" height="226" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Two AI graders agreed on 16 of 30 extra findings</title>
  <desc id="d">30 extra review findings were graded by Claude and then by Codex. On the 15 findings Codex wrote, the graders agreed on 11. On the 15 findings Claude wrote, they agreed on 5. Codex rejected 8 of the 11 Claude-written findings that the Claude grader had accepted.</desc>
  <rect x="0.5" y="0.5" width="879" height="225" rx="8" fill="#fcfcfb" stroke="#e3e2de"/>

  <text x="20" y="32" font-size="16" font-weight="600" fill="#0b0b0b">Two AI graders agreed on 16 of 30 extra findings</text>
  <text x="20" y="52" font-size="12" fill="#52514e">The same 30 findings, graded by Claude and then by Codex. One square per finding; filled = same verdict.</text>

  <g font-size="12" fill="#0b0b0b">
    <text x="20" y="95">Written by Codex (15)</text>
    <text x="20" y="135">Written by Claude (15)</text>
  </g>

  <!-- squares: x = 220 + i*28, 22 px -->
  <g fill="#1baf7a">
    <rect x="220" y="78" width="22" height="22" rx="3"/><rect x="248" y="78" width="22" height="22" rx="3"/><rect x="276" y="78" width="22" height="22" rx="3"/><rect x="304" y="78" width="22" height="22" rx="3"/><rect x="332" y="78" width="22" height="22" rx="3"/><rect x="360" y="78" width="22" height="22" rx="3"/><rect x="388" y="78" width="22" height="22" rx="3"/><rect x="416" y="78" width="22" height="22" rx="3"/><rect x="444" y="78" width="22" height="22" rx="3"/><rect x="472" y="78" width="22" height="22" rx="3"/><rect x="500" y="78" width="22" height="22" rx="3"/>
    <rect x="220" y="118" width="22" height="22" rx="3"/><rect x="248" y="118" width="22" height="22" rx="3"/><rect x="276" y="118" width="22" height="22" rx="3"/><rect x="304" y="118" width="22" height="22" rx="3"/><rect x="332" y="118" width="22" height="22" rx="3"/>
  </g>
  <g fill="#ffffff" stroke="#c9473d" stroke-width="1.5">
    <rect x="528.75" y="78.75" width="20.5" height="20.5" rx="3"/><rect x="556.75" y="78.75" width="20.5" height="20.5" rx="3"/><rect x="584.75" y="78.75" width="20.5" height="20.5" rx="3"/><rect x="612.75" y="78.75" width="20.5" height="20.5" rx="3"/>
    <rect x="360.75" y="118.75" width="20.5" height="20.5" rx="3"/><rect x="388.75" y="118.75" width="20.5" height="20.5" rx="3"/><rect x="416.75" y="118.75" width="20.5" height="20.5" rx="3"/><rect x="444.75" y="118.75" width="20.5" height="20.5" rx="3"/><rect x="472.75" y="118.75" width="20.5" height="20.5" rx="3"/><rect x="500.75" y="118.75" width="20.5" height="20.5" rx="3"/><rect x="528.75" y="118.75" width="20.5" height="20.5" rx="3"/><rect x="556.75" y="118.75" width="20.5" height="20.5" rx="3"/><rect x="584.75" y="118.75" width="20.5" height="20.5" rx="3"/><rect x="612.75" y="118.75" width="20.5" height="20.5" rx="3"/>
  </g>
  <g font-size="12" fill="#0b0b0b">
    <text x="652" y="95"><tspan font-weight="700">11</tspan> of 15 agree</text>
    <text x="652" y="135"><tspan font-weight="700">5</tspan> of 15 agree</text>
  </g>

  <g font-size="11" fill="#52514e">
    <rect x="220" y="160" width="12" height="12" rx="2" fill="#1baf7a"/><text x="238" y="170">same verdict</text>
    <rect x="330.75" y="160.75" width="10.5" height="10.5" rx="2" fill="#ffffff" stroke="#c9473d" stroke-width="1.5"/><text x="348" y="170">different verdict</text>
  </g>

  <text x="20" y="200" font-size="11" fill="#6b6a66">Codex rejected 8 of the 11 Claude-written findings the Claude grader had accepted. Neither grader is ground truth;</text>
  <text x="20" y="215" font-size="11" fill="#6b6a66">a blind sheet for a person to grade is in runs/regrade/.</text>
</svg>
