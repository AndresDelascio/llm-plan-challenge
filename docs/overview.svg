<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How /challenge works, and what I measured</title>
  <desc id="d">Five steps: you ask for a plan, Claude drafts it, a fresh reviewer (Codex or Claude) reads only the plan, each issue is accepted or rejected with a reason, and the plan is revised before any code. Measured: on three real plans all 20 issues raised were accepted; on small coding tasks plain chat passed 12 of 12 too, at about one fifteenth of the tokens; when facts were missing, chat told it may ask passed 12 of 12 against 10 of 12 for a reviewed plan.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="339" rx="8" fill="#fcfcfb" stroke="#e3e2de"/>

  <text x="20" y="32" font-size="16" font-weight="600" fill="#0b0b0b">The idea: a second AI reads your plan cold, before any code is written</text>
  <text x="20" y="52" font-size="12" fill="#52514e">One run of /challenge. The reviewer never sees the chat that produced the plan.</text>

  <!-- five steps: x = 20, 192, 364, 536, 708; width 152 -->
  <g font-size="12" fill="#52514e">
    <rect x="20" y="70" width="152" height="100" rx="10" fill="#ffffff" stroke="#e3e2de"/>
    <circle cx="40" cy="92" r="11" fill="#0b0b0b"/><text x="40" y="96" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="58" y="97" font-size="13" font-weight="600" fill="#0b0b0b">You ask</text>
    <text x="32" y="124">“Plan how to swap</text>
    <text x="32" y="140">the camera on my</text>
    <text x="32" y="156">shot tracker.”</text>

    <rect x="192" y="70" width="152" height="100" rx="10" fill="#ffffff" stroke="#e3e2de"/>
    <circle cx="212" cy="92" r="11" fill="#0b0b0b"/><text x="212" y="96" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="230" y="97" font-size="13" font-weight="600" fill="#0b0b0b">Draft</text>
    <text x="204" y="124">Claude writes a plan.</text>
    <text x="204" y="140">It tends to agree</text>
    <text x="204" y="156">with itself.</text>

    <rect x="364" y="70" width="152" height="100" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
    <circle cx="384" cy="92" r="11" fill="#2a78d6"/><text x="384" y="96" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="402" y="97" font-size="13" font-weight="600" fill="#0b0b0b">Fresh review</text>
    <text x="376" y="124">Codex or Claude reads</text>
    <text x="376" y="140">only the plan and a</text>
    <text x="376" y="156">checklist. Tools off.</text>

    <rect x="536" y="70" width="152" height="100" rx="10" fill="#ffffff" stroke="#e3e2de"/>
    <circle cx="556" cy="92" r="11" fill="#0b0b0b"/><text x="556" y="96" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="574" y="97" font-size="13" font-weight="600" fill="#0b0b0b">Decide</text>
    <text x="548" y="124">Each issue: accept</text>
    <text x="548" y="140">or reject, with a</text>
    <text x="548" y="156">reason in a log.</text>

    <rect x="708" y="70" width="152" height="100" rx="10" fill="#ffffff" stroke="#e3e2de"/>
    <circle cx="728" cy="92" r="11" fill="#0b0b0b"/><text x="728" y="96" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="746" y="97" font-size="13" font-weight="600" fill="#0b0b0b">Revise</text>
    <text x="720" y="124">The plan is fixed</text>
    <text x="720" y="140">before any code is</text>
    <text x="720" y="156">written.</text>
  </g>
  <g stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="174" y1="120" x2="189" y2="120"/>
    <line x1="346" y1="120" x2="361" y2="120"/>
    <line x1="518" y1="120" x2="533" y2="120"/>
    <line x1="690" y1="120" x2="705" y2="120"/>
  </g>

  <line x1="20" y1="192" x2="860" y2="192" stroke="#e3e2de"/>
  <text x="20" y="214" font-size="13" font-weight="600" fill="#0b0b0b">What I measured</text>

  <!-- three answers: x = 20, 307, 594; width 266 -->
  <g font-size="12" fill="#52514e">
    <rect x="20" y="226" width="266" height="98" rx="8" fill="#ffffff" stroke="#e3e2de"/>
    <rect x="20" y="226" width="5" height="98" rx="2" fill="#1baf7a"/>
    <text x="38" y="248">On three of my real plans</text>
    <text x="38" y="276" font-size="22" font-weight="700" fill="#0b0b0b">20 of 20</text>
    <text x="38" y="296">issues the reviewers raised were</text>
    <text x="38" y="312">accepted before any code</text>

    <rect x="307" y="226" width="266" height="98" rx="8" fill="#ffffff" stroke="#e3e2de"/>
    <rect x="307" y="226" width="5" height="98" rx="2" fill="#8d8c87"/>
    <text x="325" y="248">On small coding tasks</text>
    <text x="325" y="276" font-size="22" font-weight="700" fill="#0b0b0b">No gain</text>
    <text x="325" y="296">plain chat passed 12 of 12 too,</text>
    <text x="325" y="312">with about 1/15 of the tokens</text>

    <rect x="594" y="226" width="266" height="98" rx="8" fill="#ffffff" stroke="#e3e2de"/>
    <rect x="594" y="226" width="5" height="98" rx="2" fill="#2a78d6"/>
    <text x="612" y="248">When the prompt left out a fact</text>
    <text x="612" y="276" font-size="22" font-weight="700" fill="#0b0b0b">Asking won</text>
    <text x="612" y="296">chat told it may ask: 12 of 12</text>
    <text x="612" y="312">reviewed plan: 10 of 12</text>
  </g>
</svg>
