name: Offline checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -B -m unittest discover -s tests -v
      - run: python evals/plan-review/run_benchmark.py --suite full --dry-run
